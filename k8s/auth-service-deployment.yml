apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: authdb
  labels:
    app.kubernetes.io/name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      containers:
        - name: auth-service
          image: 765951922643.dkr.ecr.ap-south-1.amazonaws.com/authdb/auth-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: authdb-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: SECRET_KEY
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: MONGODB_ROOT_USER
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: MONGODB_ROOT_PASSWORD
            - name: MONGODB_DB
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: MONGODB_DB
            - name: MONGODB_URL
              value: mongodb://$(MONGODB_USER):$(MONGODB_PASSWORD)@mongodb:27017/$(MONGODB_DB)?authSource=admin
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq:5672/
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
