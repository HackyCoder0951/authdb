pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx-access.log;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        resolver 127.0.0.11 ipv6=off valid=10s;
        set $auth_service http://auth-service:8001;
        set $user_service http://user-service:8002;
        set $task_service http://task-service:8003;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /api/v1/health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /api/v1/health/auth {
            proxy_pass $auth_service/api/v1/health;
        }

        location = /api/v1/health/users {
            proxy_pass $user_service/api/v1/health;
        }

        location = /api/v1/health/tasks {
            proxy_pass $task_service/api/v1/health;
        }

        location = /api/v1/auth {
            proxy_pass $auth_service;
        }

        location ^~ /api/v1/auth/ {
            proxy_pass $auth_service;
        }

        location = /api/v1/users {
            proxy_pass $user_service;
        }

        location ^~ /api/v1/users/ {
            proxy_pass $user_service;
        }

        location = /api/v1/tasks {
            proxy_pass $task_service;
        }

        location ^~ /api/v1/tasks/ {
            proxy_pass $task_service;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }
    }
}
