version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-services/Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DB_NAME: auth_scaleDB
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
      - rabbitmq

  user-service:
    build:
      context: .
      dockerfile: services/user-services/Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DB_NAME: auth_scaleDB
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      USER_RPC_QUEUE: user_rpc_queue
    ports:
      - "8002:8002"
    depends_on:
      - mongodb
      - rabbitmq

  task-service:
    build:
      context: .
      dockerfile: services/tasks-services/Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DB_NAME: auth_scaleDB
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      USER_RPC_QUEUE: user_rpc_queue
    ports:
      - "8003:8003"
    depends_on:
      - mongodb
      - rabbitmq
      - user-service

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - task-service

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  mongodb_data:
