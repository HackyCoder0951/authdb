version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-services/Dockerfile
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq/}
    env_file:
      - .env
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8001}:8001"
    depends_on:
      - rabbitmq

  user-service:
    build:
      context: .
      dockerfile: services/user-services/Dockerfile
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq/}
      USER_RPC_QUEUE: ${USER_RPC_QUEUE:-user_rpc_queue}
    env_file:
      - .env
    ports:
      - "${USER_SERVICE_HOST_PORT:-8002}:8002"
    depends_on:
      - rabbitmq

  task-service:
    build:
      context: .
      dockerfile: services/tasks-services/Dockerfile
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq/}
      USER_RPC_QUEUE: ${USER_RPC_QUEUE:-user_rpc_queue}
    env_file:
      - .env
    ports:
      - "${TASK_SERVICE_HOST_PORT:-8003}:8003"
    depends_on:
      - rabbitmq
      - user-service

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - task-service

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - gateway

# volumes removed - using Atlas MongoDB
